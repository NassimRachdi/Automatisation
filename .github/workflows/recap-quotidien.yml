name: Récap quotidien

on:
  schedule:
    # 05:00 UTC = 6h00 à Paris en hiver, 7h00 en été
    - cron: "0 5 * * *"
  workflow_dispatch: # bouton « Run workflow » pour tester à la main

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recap_quotidien/requirements.txt

      - run: pip install -r recap_quotidien/requirements.txt

      - name: Envoyer le récapitulatif
        working-directory: recap_quotidien
        env:
          ICS_URLS: ${{ secrets.ICS_URLS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TIMEZONE: Europe/Paris
        run: python recap.py
